<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>autormm — remote</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#12141a">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="viewer-body">
  <!-- Only the controls reached for mid-session live in the bar, anchored to
       its edges: thumb controls (keyboard, paste) on the left, session controls
       on the right, with the variable-width state and title between them so
       nothing that changes width can move a button. Everything that reports a
       changing number went into the ⓘ panel below — live figures in a flex row
       shift their neighbours on every update. -->
  <div class="viewer-bar" id="bar">
    <button class="btn" id="kbd" title="Show keyboard (for touch devices)">⌨</button>
    <button class="btn" id="pasteBtn" title="Paste this device's clipboard on the host">📋</button>
    <button class="btn" id="altTab" title="Switch window (Alt+Tab). Tap again quickly to cycle further; pause to commit."><span class="lbl-wide">Alt+Tab</span><span class="lbl-narrow">Alt⇥</span></button>
    <span class="pill" id="state">connecting…</span>
    <strong id="title">remote</strong>
    <span class="grow"></span>
    <button class="btn" id="taskMgr" title="Open Task Manager (Ctrl+Shift+Esc)"><span class="lbl-wide">Task Mgr</span><span class="lbl-narrow">Task</span></button>
    <button class="btn" id="infoBtn" title="Session info and settings" aria-expanded="false">ⓘ</button>
    <button class="btn" id="fsBtn" title="Toggle fullscreen">⛶</button>
    <button class="btn ghost hidden" id="backBtn" title="Back to the dashboard">✕</button>
  </div>
  <div class="viewer-panel hidden" id="infoPanel">
    <div class="vp-stats">
      <span class="pill" id="res"></span>
      <span class="pill" id="fps"></span>
      <span class="pill" id="link"></span>
      <span class="pill" id="diag" title="Where each frame's time goes on the host."></span>
    </div>
    <div class="vp-row"><span id="displays" class="dpick"></span></div>
    <div class="vp-row">
      <select id="resPick" class="respick hidden" title="Display resolution"></select>
      <button id="fitBtn" class="btn hidden" title="Set the host resolution to best fit this window">Fit</button>
      <label id="autofitLabel" class="afl hidden" title="Auto-fit resolution on connect — remembered for this host"><input type="checkbox" id="autofit"> auto</label>
    </div>
    <div class="vp-row"><span id="codecs" class="dpick"></span></div>
    <div class="vp-row">
      <label class="muted grow">quality
        <input id="quality" type="range" min="20" max="90" value="90">
      </label>
    </div>
  </div>
  <div class="viewer-wrap">
    <canvas id="screen" width="1280" height="720"></canvas>
  </div>
  <div id="notice" class="notice hidden"></div>
  <div id="rcursor" class="rcursor hidden"></div>
  <div id="kbdbar" class="kbdbar hidden">
    <!-- Keys a phone keyboard lacks, and modifier keys that only make sense on a
         touch device as sticky one-shots: tap Ctrl (it latches), then type c to
         send Ctrl+C. Latch several at once for Ctrl+Alt+Del-style chords. -->
    <div class="kbd-keys" id="kbdKeys">
      <button class="kk" data-key="Escape">Esc</button>
      <button class="kk" data-key="Tab">Tab</button>
      <button class="kk kk-mod" data-mod="ControlLeft">Ctrl</button>
      <button class="kk kk-mod" data-mod="AltLeft">Alt</button>
      <button class="kk kk-mod" data-mod="ShiftLeft">Shift</button>
      <button class="kk kk-mod" data-mod="MetaLeft" title="Windows / Super key">⊞</button>
      <button class="kk" data-key="Delete">Del</button>
      <button class="kk" data-key="Home">Home</button>
      <button class="kk" data-key="End">End</button>
      <button class="kk" data-key="PageUp">PgUp</button>
      <button class="kk" data-key="PageDown">PgDn</button>
      <button class="kk" data-key="ArrowLeft">←</button>
      <button class="kk" data-key="ArrowUp">↑</button>
      <button class="kk" data-key="ArrowDown">↓</button>
      <button class="kk" data-key="ArrowRight">→</button>
      <button class="kk" data-key="F1">F1</button> <button class="kk" data-key="F2">F2</button> <button class="kk" data-key="F3">F3</button> <button class="kk" data-key="F4">F4</button> <button class="kk" data-key="F5">F5</button> <button class="kk" data-key="F6">F6</button> <button class="kk" data-key="F7">F7</button> <button class="kk" data-key="F8">F8</button> <button class="kk" data-key="F9">F9</button> <button class="kk" data-key="F10">F10</button> <button class="kk" data-key="F11">F11</button> <button class="kk" data-key="F12">F12</button>
    </div>
    <div class="kbd-input">
      <input id="softkbd" placeholder="Type here — text is sent to the remote" inputmode="text"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="kbdEnter" class="btn" title="Send Enter">⏎</button>
      <button id="kbdHide" class="btn ghost" title="Hide keyboard">✕</button>
    </div>
  </div>
  <script src="/static/viewer.js"></script>
</body>
</html>
